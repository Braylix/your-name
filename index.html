<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de sesiones</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#69708a;--ac:#3b5bdb;--bd:#d9dcea}
@media (prefers-color-scheme:dark){:root{--bg:#14161f;--card:#1e2130;--tx:#e8eaf3;--mu:#9aa1ba;--ac:#7c96ff;--bd:#33374d}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.3rem;margin:0 0 .8rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin-bottom:1rem}
.note{font-size:.85rem;color:var(--mu)}
.btn,input{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:.5rem .9rem;background:var(--card);color:var(--tx)}
.btn{cursor:pointer}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{margin:.3rem .4rem .3rem 0}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--bd);white-space:nowrap}
.two{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:1rem;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.stage{position:relative;width:100%;border:2px solid var(--bd);border-radius:10px;overflow:hidden;background:#000}
.stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.fing{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(224,49,49,.35);border:2px solid #e03131;pointer-events:none;z-index:5;display:none}
#viewer.full{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#e8eaf3}
#viewer.full .ctl{width:100%;max-width:640px;justify-content:center}
.cur{position:absolute;left:0;top:0;width:18px;height:18px;pointer-events:none;z-index:5}
.cur::before{content:"";display:block;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:16px solid #e03131;transform:rotate(-25deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.rip{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(224,49,49,.35);border:2px solid #e03131;pointer-events:none;z-index:4;animation:rp .5s ease-out forwards}
@keyframes rp{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.8rem 0}.ctl input[type=range]{flex:1;min-width:140px;padding:0}
.grid{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:.85rem}.grid dt{color:var(--mu)}.grid dd{margin:0;word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Panel de sesiones</h1>
  <div class="card" id="login"><b>Acceso del administrador</b><br>
    <input id="em" type="email" placeholder="Correo" autocomplete="username">
    <input id="pw" type="password" placeholder="Contrase&#241;a" autocomplete="current-password">
    <button class="btn p" id="go">Entrar</button></div>
  <p class="note" id="msg"></p>
  <div class="card wrap" id="listCard" hidden>
    <table><thead><tr><th>ID</th><th>Entrada</th><th>Duraci&#243;n</th><th>Dispositivo</th><th>SO</th><th>Navegador</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <p class="note" id="empty" hidden>A&#250;n no hay sesiones.</p>
    <button class="btn" id="refresh">Actualizar lista</button> <button class="btn" id="delall">Borrar todas</button>
  </div>
  <div class="card" id="player" hidden>
    <div class="two">
      <div id="viewer">
        <div class="stage" id="stage"><iframe id="ifr" title="Invitaci&#243;n"></iframe><div class="cur" id="cur"></div><div class="fing" id="fing"></div></div>
        <div class="ctl"><button class="btn p" id="play">Play</button><button class="btn" id="pause">Pause</button><button class="btn" id="restart">Restart</button><button class="btn" id="full">Pantalla completa</button><button class="btn" id="vid">Descargar video</button></div>
        <div class="ctl"><input type="range" id="bar" min="0" max="1000" value="0" aria-label="Progreso"><span id="clock" class="note">0:00 / 0:00</span></div>
        <p class="note" id="vmsg"></p>
      </div>
      <div><h2 style="font-size:1rem;margin-top:0">Detalles de la sesi&#243;n</h2><dl class="grid" id="det"></dl></div>
    </div>
  </div>
</main>
<script>
/* ===== CONFIGURA ESTAS 3 LÍNEAS ===== */
const SB_URL='https://mjbfqpvaymdbniiflquo.supabase.co';
const SB_KEY='sb_publishable_WWUhF8oyKHeQyVa_qfDFSA_4SM1QyLJ';
const INVITE_URL='https://sunny-bubblegum-da22c4.netlify.app/'; // dirección de tu invitación en Netlify

const $=id=>document.getElementById(id),fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let TOKEN=null,list=[];
async function sb(path){const r=await fetch(SB_URL+path,{headers:{apikey:SB_KEY,Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error(await r.text());return r.json()}

$('go').onclick=async()=>{
  try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})});
    const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||'Login fallido');
    TOKEN=j.access_token;$('login').hidden=true;$('listCard').hidden=false;renderList()}catch(e){$('msg').textContent=e.message}};
$('refresh').onclick=()=>renderList();$('delall').onclick=()=>deleteAll();
async function renderList(){
  try{const [ss,cc]=await Promise.all([sb('/rest/v1/sessions?select=id,started_at,device&order=started_at.desc&limit=50'),sb('/rest/v1/session_chunks?select=session_id,dur&order=dur.desc&limit=1000')]);
    const dur={};cc.forEach(c=>{if(!(c.session_id in dur))dur[c.session_id]=c.dur});
    list=ss.map(x=>Object.assign(x,{duration:dur[x.id]||0}));$('msg').textContent=''}catch(e){$('msg').textContent='Error: '+e.message;return}
  const tb=$('rows');tb.innerHTML='';$('empty').hidden=list.length>0;
  list.forEach(x=>{const tr=document.createElement('tr');
    [x.id,new Date(x.started_at).toLocaleString(),fmt(x.duration),x.device.type,x.device.os,x.device.browser].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});
    const td=document.createElement('td'),b=document.createElement('button');b.className='btn p';b.textContent='Reproducir';b.onclick=()=>openSession(x.id);const e=document.createElement('button');e.className='btn';e.textContent='Eliminar';e.style.marginLeft='.4rem';e.onclick=()=>deleteOne(x.id);td.append(b,e);tr.appendChild(td);tb.appendChild(tr)});
}

/* ===== Eliminar (pide confirmación, sin contraseña) ===== */
async function del(path,rep){const r=await fetch(SB_URL+path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+TOKEN,Prefer:rep?'return=representation':'return=minimal'}});
  if(!r.ok)throw new Error(await r.text());return rep?r.json():null}
function closePlayer(){pause();cs=null;$('player').hidden=true}
async function deleteOne(id){
  if(!confirm('¿Seguro que quieres eliminar la sesión '+id+'? No se puede deshacer.'))return;
  try{await del('/rest/v1/session_chunks?session_id=eq.'+encodeURIComponent(id),false);
    const r=await del('/rest/v1/sessions?id=eq.'+encodeURIComponent(id),true);
    if(!r.length)throw new Error('No se pudo borrar. ¿Ejecutaste el SQL de permisos para borrar?');
    if(cs&&cs.id===id)closePlayer();renderList()}catch(e){$('msg').textContent='Error: '+e.message}}
async function deleteAll(){
  if(!confirm('¿Seguro que quieres eliminar TODAS las grabaciones? No se puede deshacer.'))return;
  try{await del('/rest/v1/session_chunks?session_id=not.is.null',false);
    const r=await del('/rest/v1/sessions?id=not.is.null',true);
    if(list.length&&!r.length)throw new Error('No se pudo borrar. ¿Ejecutaste el SQL de permisos para borrar?');
    closePlayer();renderList()}catch(e){$('msg').textContent='Error: '+e.message}}

/* ===== Reproductor: el iframe muestra la invitación real; aquí se dibuja el cursor ===== */
const ifr=$('ifr'),stage=$('stage'),cur=$('cur'),fing=$('fing'),viewer=$('viewer'),origin=new URL(INVITE_URL).origin;
let cs=null,idx=0,playing=false,posMs=0,wall=0,raf=0,ready=false,onEnd=null;
const send=m=>ifr.contentWindow&&ifr.contentWindow.postMessage(m,origin);
addEventListener('message',e=>{if(e.origin===origin&&e.data&&e.data.type==='ready'){ready=true;const v=cs&&cs.device.view;if(v&&v.fs)send({type:'init',fs:v.fs});seek(0)}});

function layout(){ // el iframe usa el tamaño real de la ventana grabada y se escala
  const d=cs.device,v=d.view||{},[fw,fh]=(d.viewport||'390x700').split('x').map(Number),w=v.w||fw,h=v.h||fh;
  const full=viewer.classList.contains('full');stage.style.width=full?Math.max(120,Math.min(innerWidth-24,(innerHeight-150)*w/h))+'px':'100%';const k=stage.clientWidth/w;
  ifr.style.width=w+'px';ifr.style.height=h+'px';ifr.style.transform='scale('+k+')';stage.style.height=(h*k)+'px'}
function apply(ev,quiet){
  const x=(ev.x||0)*stage.clientWidth,y=(ev.y||0)*stage.clientHeight;
  if(ev.type==='move'||ev.type==='click'){cur.style.transform='translate('+x+'px,'+y+'px)';send({type:'pt',x:ev.x,y:ev.y})}
  if(ev.type==='tdown'||ev.type==='tmove'){fing.style.display='block';fing.style.transform='translate('+x+'px,'+y+'px)'}
  if(ev.type==='tup')fing.style.display='none';
  if((ev.type==='click'||ev.type==='tdown')&&!quiet){const d=document.createElement('div');d.className='rip';d.style.left=x+'px';d.style.top=y+'px';stage.appendChild(d);setTimeout(()=>d.remove(),600)}
  if(ev.type==='scroll')send({type:'scroll',p:ev.p});
  if(ev.type==='act')send({type:'act',a:ev.a});
}
function seek(ms){if(!cs||!ready)return;send({type:'reset',t:ms});cur.style.transform='translate(-30px,-30px)';fing.style.display='none';idx=0;posMs=ms;
  while(idx<cs.events.length&&cs.events[idx].t<=ms)apply(cs.events[idx++],true);ui()}
function ui(){$('bar').value=cs.duration?Math.round(posMs/cs.duration*1000):0;$('clock').textContent=fmt(posMs)+' / '+fmt(cs.duration)}
function tick(){if(!playing)return;posMs=Math.min(cs.duration,performance.now()-wall);
  while(idx<cs.events.length&&cs.events[idx].t<=posMs)apply(cs.events[idx++],false);
  ui();if(posMs>=cs.duration){playing=false;if(onEnd){const f=onEnd;onEnd=null;f()}return}raf=requestAnimationFrame(tick)}
function play(){if(!cs||!ready||playing)return;if(posMs>=cs.duration)seek(0);playing=true;wall=performance.now()-posMs;raf=requestAnimationFrame(tick)}
function pause(){playing=false;cancelAnimationFrame(raf)}
$('play').onclick=play;$('pause').onclick=pause;$('restart').onclick=()=>{pause();seek(0);play()};
$('bar').oninput=e=>{const was=playing;pause();seek(e.target.value/1000*cs.duration);if(was)play()};

async function openSession(id){
  const row=list.find(s=>s.id===id);if(!row)return;pause();
  let ch;try{ch=await sb('/rest/v1/session_chunks?select=events,dur&session_id=eq.'+encodeURIComponent(id)+'&order=seq.asc')}catch(e){$('msg').textContent='Error: '+e.message;return}
  cs={id,start:row.started_at,device:row.device,duration:Math.max(0,...ch.map(c=>c.dur)),events:ch.flatMap(c=>c.events)};
  $('player').hidden=false;layout();
  const d=cs.device,rows=[['ID',cs.id],['Entrada',new Date(cs.start).toLocaleString()],['Duración',fmt(cs.duration)],['Eventos',cs.events.length],['Dispositivo',d.type],['SO',d.os],['Navegador',d.browser],['Pantalla',d.screen],['Ventana',d.viewport+' (x'+d.dpr+')'],['Orientación',d.orientation],['Idioma',d.lang],['Zona horaria',d.tz],['Client Hints',d.hints],['User-Agent',d.ua]];
  const dl=$('det');dl.innerHTML='';rows.forEach(r=>{const a=document.createElement('dt'),b=document.createElement('dd');a.textContent=r[0];b.textContent=r[1];dl.append(a,b)});
  ready=false;ifr.src=INVITE_URL+(INVITE_URL.includes('?')?'&':'?')+'replay=1'; // al cargar, avisa "ready" y se hace seek(0)
  $('player').scrollIntoView({behavior:'smooth'});
}
addEventListener('resize',()=>{if(cs)layout()});

/* ===== Pantalla completa ===== */
function toggleFull(){
  const on=!viewer.classList.contains('full');viewer.classList.toggle('full',on);
  if(on){const f=viewer.requestFullscreen||viewer.webkitRequestFullscreen;if(f)try{const r=f.call(viewer);if(r&&r.catch)r.catch(()=>{})}catch(e){}} // en iPhone no existe: queda el modo que cubre toda la pantalla
  else if(document.fullscreenElement)document.exitFullscreen();
  $('full').textContent=on?'Salir de pantalla completa':'Pantalla completa';if(cs)layout()}
$('full').onclick=toggleFull;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&viewer.classList.contains('full')){viewer.classList.remove('full');$('full').textContent='Pantalla completa';if(cs)layout()}});

/* ===== Descargar como video (graba la pestaña recortada al reproductor) ===== */
const lock=on=>document.querySelectorAll('#player .btn,#bar').forEach(b=>b.disabled=on);
async function recordVideo(){
  const vm=$('vmsg');
  if(!cs||!ready)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){vm.textContent='La descarga de video solo funciona en Chrome o Edge desde una computadora.';return}
  if(viewer.classList.contains('full'))toggleFull();
  pause();stage.scrollIntoView({block:'center'});
  let stream;
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'})}
  catch(e){vm.textContent='Grabación cancelada.';return}
  const track=stream.getVideoTracks()[0];
  try{
    if(window.RestrictionTarget&&track.restrictTo)await track.restrictTo(await RestrictionTarget.fromElement(stage));
    else if(window.CropTarget&&track.cropTo)await track.cropTo(await CropTarget.fromElement(stage));
    else vm.textContent='Tu navegador no puede recortar: se grabará toda la pestaña. ';
  }catch(e){track.stop();vm.textContent='Al compartir, elige "Esta pestaña" (la pestaña actual).';return}
  const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{videoBitsPerSecond:4e6}),chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());pause();onEnd=null;lock(false);
    const blob=new Blob(chunks,{type:mr.mimeType}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='sesion-'+cs.id+(mr.mimeType.includes('mp4')?'.mp4':'.webm');
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);vm.textContent='Video descargado.'};
  track.onended=()=>{if(mr.state!=='inactive')mr.stop()}; // si detienes "compartir" antes, se guarda lo grabado
  lock(true);vm.textContent='Grabando... no muevas ni cambies de pestaña hasta que termine.';
  mr.start(1000);seek(0);
  await new Promise(r=>setTimeout(r,500));
  onEnd=()=>setTimeout(()=>{if(mr.state!=='inactive')mr.stop()},700);
  play();
}
$('vid').onclick=recordVideo;
</script>
</body>
</html>
